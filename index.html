<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Календарь Теняковых">
    <title>Календарь Теняковых</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 10px;
            transition: background 0.5s ease;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            color: white;
            padding: 20px 15px;
            text-align: center;
            transition: background 0.5s ease;
        }
        
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        
        .sync-status {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 11px;
            margin-top: 8px;
        }
        
        .sync-status.connected { background: rgba(67, 233, 123, 0.3); }
        .sync-status.error { background: rgba(255, 107, 107, 0.3); }
        
        .install-btn {
            display: none;
            margin-top: 10px;
            padding: 8px 20px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .install-btn.visible { display: inline-block; }
        
        .calendar { padding: 15px; }
        
        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .month-title {
            font-size: 20px;
            font-weight: bold;
            transition: color 0.5s ease;
            flex: 1;
            text-align: center;
        }
        
        .month-nav {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: inherit;
            padding: 5px 15px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .month-nav:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 8px;
        }
        
        .weekday {
            text-align: center;
            font-weight: bold;
            padding: 8px 2px;
            font-size: 12px;
            transition: color 0.5s ease;
        }
        
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        
        .day {
            min-height: 80px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 5px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .day:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .day-number {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-bottom: 3px;
        }
        
        .day.today { border-width: 3px; }
        .day.today .day-number { color: white; }
        
        .events-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            overflow: hidden;
        }
        
        .event-tag {
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 4px;
            color: white;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .event-tag.papa { background: #4facfe; }
        .event-tag.mama { background: #d57eeb; }
        .event-tag.gosha { background: #43e97b; }
        .event-tag.roma { background: #fa709a; }
        .event-tag.family { background: #f6d365; }
        
        .more-events {
            font-size: 9px;
            color: #666;
            text-align: center;
            margin-top: 2px;
        }
        
        .day.other-month { opacity: 0.3; }
        
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }
        
        .form-group { margin-bottom: 15px; }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 13px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }
        
        .event-item {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .event-info { flex: 1; }
        
        .event-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 3px;
            font-size: 14px;
        }
        
        .event-details { font-size: 12px; color: #666; }
        
        .event-person-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            color: white;
            font-size: 11px;
            font-weight: 500;
            margin-left: 5px;
        }
        
        .event-person-tag.papa { background: #4facfe; }
        .event-person-tag.mama { background: #d57eeb; }
        .event-person-tag.gosha { background: #43e97b; }
        .event-person-tag.roma { background: #fa709a; }
        .event-person-tag.family { background: #f6d365; }
        
        .delete-event {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .no-events {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
        
        .pin-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .pin-screen.hidden { display: none; }
        
        .pin-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .pin-container h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .pin-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            letter-spacing: 10px;
        }
        
        .pin-error {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 14px;
        }
        
        @media (max-width: 600px) {
            body { padding: 5px; }
            .header h1 { font-size: 20px; }
            .header p { font-size: 12px; }
            .month-title { font-size: 18px; }
            .day { min-height: 70px; }
            .day-number { font-size: 14px; }
            .event-tag { font-size: 8px; padding: 2px 3px; }
            .weekday { font-size: 11px; padding: 6px 1px; }
            .month-nav { padding: 5px 10px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="pin-screen" id="pinScreen">
        <div class="pin-container">
            <h2>🔒 Введите ПИН-код</h2>
            <input type="password" class="pin-input" id="pinInput" maxlength="4" placeholder="****">
            <button class="btn btn-primary" onclick="checkPin()">Войти</button>
            <div class="pin-error" id="pinError"></div>
        </div>
    </div>

    <div class="container">
        <div class="header" id="header">
            <h1> Календарь Теняковых</h1>
            <p>Все планы семьи в одном месте</p>
            <div class="sync-status" id="syncStatus">⏳ Подключение...</div>
            <button class="install-btn" id="installBtn">📱 Установить приложение</button>
        </div>
        
        <div class="calendar">
            <div class="month-header">
                <button class="month-nav" onclick="changeMonth(-1)">◀</button>
                <div class="month-title" id="monthTitle">Сентябрь 2026</div>
                <button class="month-nav" onclick="changeMonth(1)">▶</button>
            </div>
            
            <div class="weekdays">
                <div class="weekday">Пн</div>
                <div class="weekday">Вт</div>
                <div class="weekday">Ср</div>
                <div class="weekday">Чт</div>
                <div class="weekday">Пт</div>
                <div class="weekday">Сб</div>
                <div class="weekday">Вс</div>
            </div>
            
            <div class="days" id="calendarDays"></div>
        </div>
    </div>

    <div class="modal" id="addEventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить событие</h2>
                <button class="close-modal" onclick="closeModal()">✕</button>
            </div>
            
            <div id="addEventForm">
                <div class="form-group">
                    <label>Название события</label>
                    <input type="text" id="eventTitle" placeholder="Например: Больница">
                </div>
                <div class="form-group">
                    <label>Время</label>
                    <input type="time" id="eventTime">
                </div>
                <div class="form-group">
                    <label>Для кого</label>
                    <select id="eventPerson">
                        <option value="Папа">Папа</option>
                        <option value="Мама">Мама</option>
                        <option value="Гоша">Гоша</option>
                        <option value="Рома">Рома</option>
                        <option value="Вся семья">Вся семья</option>
                    </select>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="repeatWeekly">
                    <label for="repeatWeekly">Повторять каждую неделю</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="sendNotification" checked>
                    <label for="sendNotification">Отправить уведомление семье</label>
                </div>
                <button class="btn btn-primary" onclick="saveEvent()" style="margin-top: 15px;">Сохранить</button>
            </div>
            
            <div id="eventsList" style="display: none;">
                <h3 style="margin-bottom: 15px; font-size: 16px;">События на этот день:</h3>
                <div id="eventsContainer"></div>
                <button class="btn btn-primary" onclick="showAddForm()" style="margin-top: 15px;">+ Добавить событие</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query } 
            from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwiL_rTfgmSAxxwgoGY-BHQqKhXVFPCR4",
            authDomain: "family-calendar-23e17.firebaseapp.com",
            projectId: "family-calendar-23e17",
            storageBucket: "family-calendar-23e17.firebasestorage.app",
            messagingSenderId: "1025343495734",
            appId: "1:1025343495734:web:a268856e2e6075b817c297"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.saveEventToFirestore = async function(dateKey, title, time, person, repeatWeekly) {
            try {
                const eventData = {
                    dateKey: dateKey,
                    title: title,
                    time: time,
                    person: person,
                    createdAt: new Date()
                };
                
                await addDoc(collection(db, "events"), eventData);
                
                if (repeatWeekly) {
                    const [year, month, day] = dateKey.split('-').map(Number);
                    for (let i = 1; i <= 4; i++) {
                        const nextDate = new Date(year, month - 1, day + (i * 7));
                        const nextKey = `${nextDate.getFullYear()}-${nextDate.getMonth() + 1}-${nextDate.getDate()}`;
                        await addDoc(collection(db, "events"), {
                            ...eventData,
                            dateKey: nextKey,
                            isRepeat: true
                        });
                    }
                }
                
                console.log('✅ Событие сохранено');
            } catch (e) {
                console.error('Ошибка:', e);
                alert('Ошибка сохранения: ' + e.message);
            }
        };
        
        window.deleteEventFromFirestore = async function(eventId) {
            try {
                await deleteDoc(doc(db, "events", eventId));
                console.log('✅ Событие удалено');
            } catch (e) {
                console.error('Ошибка:', e);
                alert('Ошибка удаления: ' + e.message);
            }
        };
        
        window.listenToEvents = function() {
            const q = query(collection(db, "events"));
            onSnapshot(q, (snapshot) => {
                const allEvents = {};
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const key = data.dateKey;
                    if (!allEvents[key]) allEvents[key] = [];
                    allEvents[key].push({
                        id: doc.id,
                        title: data.title,
                        time: data.time,
                        person: data.person
                    });
                });
                
                Object.keys(allEvents).forEach(key => {
                    allEvents[key].sort((a, b) => {
                        if (!a.time) return 1;
                        if (!b.time) return -1;
                        return a.time.localeCompare(b.time);
                    });
                });
                
                window.currentEvents = allEvents;
                window.generateCalendar();
                
                document.getElementById('syncStatus').textContent = '✅ Синхронизировано';
                document.getElementById('syncStatus').className = 'sync-status connected';
            }, (error) => {
                console.error('Ошибка:', error);
                document.getElementById('syncStatus').textContent = '❌ Ошибка';
                document.getElementById('syncStatus').className = 'sync-status error';
            });
        };
        
        window.firebaseReady = true;
    </script>

    <script>
        const monthColors = {
            0: { gradient: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', background: 'linear-gradient(135deg, #e0e7ff 0%, #f0f4ff 100%)', accent: '#667eea' },
            1: { gradient: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)', background: 'linear-gradient(135deg, #f0f9ff 0%, #fef5f5 100%)', accent: '#a8edea' },
            2: { gradient: 'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)', background: 'linear-gradient(135deg, #f0fff4 0%, #f0f9ff 100%)', accent: '#84fab0' },
            3: { gradient: 'linear-gradient(135deg, #fccb90 0%, #d57eeb 100%)', background: 'linear-gradient(135deg, #fff5f5 0%, #fef5ff 100%)', accent: '#d57eeb' },
            4: { gradient: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)', background: 'linear-gradient(135deg, #f0fff4 0%, #f0fffc 100%)', accent: '#43e97b' },
            5: { gradient: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', background: 'linear-gradient(135deg, #f0f9ff 0%, #f0fffe 100%)', accent: '#4facfe' },
            6: { gradient: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', background: 'linear-gradient(135deg, #e0f7ff 0%, #f0fffe 100%)', accent: '#0099cc' },
            7: { gradient: 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)', background: 'linear-gradient(135deg, #fffbf0 0%, #fff5f0 100%)', accent: '#f6d365' },
            8: { gradient: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)', background: 'linear-gradient(135deg, #fff5f0 0%, #fffbf0 100%)', accent: '#fa709a' },
            9: { gradient: 'linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%)', background: 'linear-gradient(135deg, #fff5f0 0%, #fff0f5 100%)', accent: '#ff9a56' },
            10: { gradient: 'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)', background: 'linear-gradient(135deg, #f5f0ff 0%, #fef5ff 100%)', accent: '#a18cd1' },
            11: { gradient: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', background: 'linear-gradient(135deg, #f0f0ff 0%, #f5f0ff 100%)', accent: '#764ba2' }
        };

        const personColors = {
            'Папа': 'papa',
            'Мама': 'mama',
            'Гоша': 'gosha',
            'Рома': 'roma',
            'Вся семья': 'family'
        };

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        const currentDate = new Date().getDate();
        
        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
            'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        
        window.currentEvents = {};
        let selectedDate = null;
        
        const PIN_CODE = '1234';
        
        function checkPin() {
            const input = document.getElementById('pinInput').value;
            if (input === PIN_CODE) {
                document.getElementById('pinScreen').classList.add('hidden');
                localStorage.setItem('pinVerified', 'true');
            } else {
                document.getElementById('pinError').textContent = 'Неверный ПИН-код';
                document.getElementById('pinInput').value = '';
            }
        }
        
        if (localStorage.getItem('pinVerified') === 'true') {
            document.getElementById('pinScreen').classList.add('hidden');
        }
        
        document.getElementById('pinInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPin();
        });
        
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            updateCalendar();
        }
        
        function updateCalendar() {
            document.getElementById('monthTitle').textContent = `${monthNames[currentMonth]} ${currentYear}`;
            applyMonthColors();
            window.generateCalendar();
        }
        
        function applyMonthColors() {
            const colors = monthColors[currentMonth];
            document.body.style.background = colors.background;
            document.getElementById('header').style.background = colors.gradient;
            document.getElementById('monthTitle').style.color = colors.accent;
            
            document.querySelectorAll('.weekday').forEach(day => day.style.color = colors.accent);
            
            const todayElement = document.querySelector('.day.today');
            if (todayElement) {
                todayElement.style.background = colors.gradient;
                todayElement.style.borderColor = colors.accent;
            }
        }
        
        window.generateCalendar = function() {
            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';
            
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            
            let startingDay = firstDay.getDay() - 1;
            if (startingDay < 0) startingDay = 6;
            
            const prevMonthLastDay = new Date(currentYear, currentMonth, 0).getDate();
            for (let i = startingDay - 1; i >= 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day other-month';
                dayDiv.innerHTML = `<div class="day-number">${prevMonthLastDay - i}</div>`;
                calendarDays.appendChild(dayDiv);
            }
            
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';
                
                if (day === currentDate && currentMonth === new Date().getMonth() && currentYear === new Date().getFullYear()) {
                    dayDiv.classList.add('today');
                }
                
                const dateKey = `${currentYear}-${currentMonth + 1}-${day}`;
                const dayEvents = window.currentEvents[dateKey] || [];
                
                let eventsHTML = '';
                if (dayEvents.length > 0) {
                    eventsHTML = '<div class="events-container">';
                    const maxShow = 3;
                    dayEvents.slice(0, maxShow).forEach(event => {
                        const personClass = personColors[event.person] || 'papa';
                        const timeStr = event.time ? event.time + ' ' : '';
                        eventsHTML += `<div class="event-tag ${personClass}">${timeStr}${event.person}</div>`;
                    });
                    if (dayEvents.length > maxShow) {
                        eventsHTML += `<div class="more-events">+${dayEvents.length - maxShow}</div>`;
                    }
                    eventsHTML += '</div>';
                }
                
                dayDiv.innerHTML = `<div class="day-number">${day}</div>${eventsHTML}`;
                dayDiv.onclick = () => openModal(day);
                
                calendarDays.appendChild(dayDiv);
            }
            
            const totalCells = calendarDays.children.length;
            const remainingCells = 42 - totalCells;
            for (let day = 1; day <= remainingCells; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day other-month';
                dayDiv.innerHTML = `<div class="day-number">${day}</div>`;
                calendarDays.appendChild(dayDiv);
            }
        }
        
        function openModal(day) {
            selectedDate = day;
            const dateKey = `${currentYear}-${currentMonth + 1}-${day}`;
            const dayEvents = window.currentEvents[dateKey] || [];
            
            if (dayEvents.length > 0) {
                showEventsList(dayEvents);
            } else {
                showAddForm();
            }
            
            document.getElementById('addEventModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('addEventModal').classList.remove('active');
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventTime').value = '';
            document.getElementById('repeatWeekly').checked = false;
        }
        
        function showAddForm() {
            document.getElementById('addEventForm').style.display = 'block';
            document.getElementById('eventsList').style.display = 'none';
            document.getElementById('modalTitle').textContent = `Добавить событие на ${selectedDate} ${monthNames[currentMonth].toLowerCase()}`;
        }
        
        function showEventsList(dayEvents) {
            document.getElementById('addEventForm').style.display = 'none';
            document.getElementById('eventsList').style.display = 'block';
            document.getElementById('modalTitle').textContent = `События на ${selectedDate} ${monthNames[currentMonth].toLowerCase()}`;
            
            const container = document.getElementById('eventsContainer');
            container.innerHTML = '';
            
            dayEvents.forEach(event => {
                const personClass = personColors[event.person] || 'papa';
                const eventDiv = document.createElement('div');
                eventDiv.className = 'event-item';
                eventDiv.innerHTML = `
                    <div class="event-info">
                        <div class="event-title">${event.title}</div>
                        <div class="event-details">
                            ${event.time ? '🕐 ' + event.time + ' | ' : ''}
                            <span class="event-person-tag ${personClass}">${event.person}</span>
                        </div>
                    </div>
                    <button class="delete-event" onclick="deleteEvent('${event.id}')">Удалить</button>
                `;
                container.appendChild(eventDiv);
            });
        }
        
        async function saveEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const time = document.getElementById('eventTime').value;
            const person = document.getElementById('eventPerson').value;
            const repeatWeekly = document.getElementById('repeatWeekly').checked;
            const sendNotification = document.getElementById('sendNotification').checked;
            
            if (!title) {
                alert('Введите название события');
                return;
            }
            
            const dateKey = `${currentYear}-${currentMonth + 1}-${selectedDate}`;
            await window.saveEventToFirestore(dateKey, title, time, person, repeatWeekly);
            
            if (sendNotification && 'Notification' in window) {
                if (Notification.permission === 'granted') {
                    new Notification('📅 Новое событие!', {
                        body: `${title} - ${person} в ${time || 'весь день'}`,
                        icon: 'icon-192.png'
                    });
                } else if (Notification.permission !== 'denied') {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            new Notification('📅 Новое событие!', {
                                body: `${title} - ${person} в ${time || 'весь день'}`,
                                icon: 'icon-192.png'
                            });
                        }
                    });
                }
            }
            
            closeModal();
        }
        
        async function deleteEvent(eventId) {
            await window.deleteEventFromFirestore(eventId);
            
            const dateKey = `${currentYear}-${currentMonth + 1}-${selectedDate}`;
            const dayEvents = window.currentEvents[dateKey] || [];
            if (dayEvents.length > 0) {
                showEventsList(dayEvents);
            } else {
                showAddForm();
            }
        }
        
        // PWA установка
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.add('visible');
        });
        
        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBtn').classList.remove('visible');
                }
                deferredPrompt = null;
            }
        });
        
        function startApp() {
            if (window.firebaseReady) {
                window.listenToEvents();
                updateCalendar();
            } else {
                setTimeout(startApp, 100);
            }
        }
        
        startApp();
    </script>
</body>
</html>
